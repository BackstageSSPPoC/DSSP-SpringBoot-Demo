apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: DSSP-SpringBoot-Demo
  annotations:
    github.com/project-slug: BackstageSSPPoC/DSSP-SpringBoot-Demo
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-id: DSSP-SpringBoot-Demo
    sonarqube.org/project-key: dssp-springboot-demo
    jenkins.io/job-full-name: Backstage_SSP_PoC/DSSP-SpringBoot-Demo/main
    argocd/app-name: dssp-springboot-demo-dev
    prometheus.io/rule: "kube_pod_status_phase{pod=~'dssp-springboot-demo.*'}|phase,kube_pod_container_status_restarts_total{pod=~'dssp-springboot-demo.*'}|container"
    prometheus.io/alert: "KubePodCrashLooping,KubeDeploymentReplicasMismatch,KubePodNotReady,KubeContainerWaiting,KubeContainerOOMKilled,KubeDeploymentRolloutStuck"
    prometheus.io/labels: "namespace=dev"
    grafana/overview-dashboard: 'http://34.29.242.32/grafana/d/ffuuiuytw0f0gb/backstage-view?var-pod_prefix=dssp-springboot-demo&var-namespace=dev&kiosk' 
  tags:
    - java-maven
    - scaffolded
spec:
  type: service
  lifecycle: Dev
  owner: user:default/chaitanya-shekhar-pandey
  system: dssp-platform
